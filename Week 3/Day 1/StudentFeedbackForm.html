<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback Form</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial; margin: 40px; }
        input, select, textarea { display:block; margin-bottom:10px; width:300px; padding:8px; }
        button { padding:8px 15px; }
        .success { color: green; margin-top: 15px; }
        .error { color: red; }
    </style>
</head>
<body>

<h2>Student Feedback Form</h2>

<form id="feedbackForm">
    <input type="text" id="name" placeholder="Enter Name">
    <input type="email" id="email" placeholder="Enter Email">
    
    <select id="rating">
        <option value="">Select Rating</option>
        <option>Excellent</option>
        <option>Good</option>
        <option>Average</option>
        <option>Poor</option>
    </select>
    
    <textarea id="comments" placeholder="Enter Comments"></textarea>
    
    <button type="button" id="submitBtn">Submit</button>
</form>

<div id="message"></div>

<script>
$(document).ready(function() {
    $("#submitBtn").click(function() {
        
        var name = $("#name").val().trim();
        var email = $("#email").val().trim();

        if(name === "" || email === "") {
            $("#message").html("<p class='error'>Name and Email are required!</p>");
        } else {
            $("#message").html("<p class='success'>Thank you for your feedback!</p>");
            
            $("#feedbackForm")[0].reset(); 
        }
    });
});
</script>

</body>
</html>
