<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
 <!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">College Events</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
  </div>
</nav>

<div class="container my-4">
  <div class="row">

    <!-- Event List -->
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header">Upcoming Events</div>
        <div class="card-body">
          <ul class="list-group">
            <li class="list-group-item">Tech Fest</li>
            <li class="list-group-item">Sports Day</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Add Event Button -->
    <div class="col-lg-4 text-center">
      <button class="btn btn-success mt-3" data-bs-toggle="modal" data-bs-target="#eventModal">
        Add Event
      </button>
    </div>

  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="eventModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Add Event</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form>
          <input type="text" class="form-control mb-3" placeholder="Event Name" required>
          <input type="date" class="form-control mb-3" required>
          <button class="btn btn-primary w-100">Submit</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>   
</body>
</html>
