<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - Upgrad Events</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="Style.css">


</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary px-3">
    <a class="navbar-brand" href="index.html">Upgrad Events</a>
    <div class="ms-auto">
      <a href="Home.html" class="text-white me-3 text-decoration-none">Home</a>
      <a href="AdminLogin.html" class="text-white me-3 text-decoration-none">Login</a>
      <a href="events.html" class="text-white me-3 text-decoration-none">Events</a>
      <a href="contact.html" class="text-white text-decoration-none">Contact Us</a>
    </div>
  </nav>

  <!-- Login Form -->
<div class="container-fluid">
    <div class="login">
        <h3>Login</h3>
        <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="admin@upgrad.com" required />
        </div>
        <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Password" required />
        </div>
        <button class="btn" onclick="Login()">Login</button>
    </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Hard-coded admin credentials
    var ADMIN_EMAIL = "admin@upgrad.com";
    var ADMIN_PASSWORD = "12345";

    function Login() {
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value.trim();

      // Check if fields are empty
      if (!email || !password) {
        alert("Please enter email and password!");
        return;
      }

      // Check credentials
      if (email === "admin@upgrad.com" && password === "12345") {
        // Save login status in sessionStorage
        sessionStorage.setItem("isLoggedIn", "true");
        // Redirect to events page
        window.location.href = "events.html";
      } else {
        alert("Invalid email or password! Please try again.");
      }
    }
  </script>
</body>
</html>
