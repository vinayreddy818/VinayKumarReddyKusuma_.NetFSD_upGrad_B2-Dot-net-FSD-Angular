<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary px-3">
    <a class="navbar-brand" href="index.html">Upgrad Events</a>
    <div class="ms-auto">
      <a href="Home.html" class="text-white me-3 text-decoration-none">Home</a>
      <a href="AdminLogin.html" class="text-white me-3 text-decoration-none">Login</a>
      <a href="events.html" class="text-white me-3 text-decoration-none">Events</a>
      <a href="contact.html" class="text-white text-decoration-none">Contact Us</a>
    </div>
  </nav>

  <!-- Registration Page Content -->
  <div class="container mt-4">
    <h3 class="fw-bold mb-4">Event Registration</h3>

    <!-- Event Details Box -->
    <div class="event-card" id="eventDetailsBox">
      <h5>Event Details</h5>
      <p id="eventId"></p>
      <p id="eventName"></p>
      <p id="eventCategory"></p>
      <p id="eventDate"></p>
      <p id="eventTime"></p>
    </div>

    <!-- Participant Details Box -->
    <div class="section-box">
      <h5>Participant Details</h5>
      <div class="mb-3">
        <input type="text" id="firstName" class="form-control" placeholder="First Name" required />
      </div>
      <div class="mb-3">
        <input type="text" id="lastName" class="form-control" placeholder="Last Name" required />
      </div>
      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="Email" required />
      </div>
      <button class="btn btn-success" onclick="registerParticipant()">Register</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="register.js"></script>
</body>
