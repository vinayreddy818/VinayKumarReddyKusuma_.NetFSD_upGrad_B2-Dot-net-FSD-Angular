<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpgradEvents</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary px-3">
        <a class="navbar-brand">Upgrad Events</a>
        <div class="ms-auto">
            <a href="Home.html" class="text-white me-3 text-decoration-none">Home</a>
            <a href="AdminLogin.html" class="text-white me-3 text-decoration-none">Login</a>
            <a href="events.html" class="text-white me-3 text-decoration-none">Events</a>
            <a href="contact.html" class="text-white text-decoration-none">Contact Us</a>
        </div>
    </nav>

    <!-- Heading -->
    <div class="Heading-Section">
        <h1>Welcome to Upgrad Virtual Event Management</h1>
        <p>
            Upgrad hosts virtual events in categories like Tech & Innovations and Industrial Events.
            Join us to explore knowledge, connect with experts, and enhance your professional skills.
        </p>
    </div>

    <!-- Events -->
    <div class="container-fluid">
        <h1 style="text-align:center; margin:20px; color:white">Upcoming Events</h1>

        <div class="row" id="card-items"></div>
    </div>

    <!-- Script -->
    <script>
        let db;
        let request = indexedDB.open("upgradEventsDB", 1);

        // Create DB if not exists
        request.onupgradeneeded = function (e) {
            db = e.target.result;
            db.createObjectStore("events", { keyPath: "id" });
        };

        // DB success
        request.onsuccess = function (e) {
            db = e.target.result;
            loadEvents();
        };

        request.onerror = function () {
            console.log("Database error");
        };

        // Load events
        function loadEvents() {
            let tx = db.transaction("events", "readonly");
            let store = tx.objectStore("events");
            let req = store.getAll();

            req.onsuccess = function () {
                let events = req.result;

                // If empty → add default events
                if (events.length === 0) {
                    seedDefaultEvents();
                } else {
                    displayEvents(events);
                }
            };
        }

        // Insert default events (first time only)
        function seedDefaultEvents() {
            let defaults = [
                {
                    id: "101",
                    name: ".NET Foundations",
                    category: "Tech & Innovations",
                    date: "2026-03-04",
                    time: "15:15",
                    url: "https://devtech.com"
                },
                {
                    id: "102",
                    name: "Global Summit",
                    category: "Tech & Innovations",
                    date: "2026-03-09",
                    time: "14:15",
                    url: "https://mctsummit.com"
                }
            ];

            let tx = db.transaction("events", "readwrite");
            let store = tx.objectStore("events");

            defaults.forEach(ev => store.add(ev));

            tx.oncomplete = function () {
                displayEvents(defaults);
            };
        }

        // Display events
        function displayEvents(events) {
            let container = document.getElementById("card-items");
            container.innerHTML = "";

            if (events.length === 0) {
                container.innerHTML = `<p style="color:white">No Events Available</p>`;
                return;
            }

            events.forEach(function (e) {
                let col = document.createElement("div");
                col.className = "col-md-4";

                col.innerHTML = `
                    <div class="event-card">
                        <h5>${e.name}</h5>
                        <p><strong>Category:</strong> ${e.category}</p>
                        <p><strong>Date:</strong> ${e.date}</p>
                        <p><strong>Time:</strong> ${e.time}</p>
                        <a href="register.html?id=${e.id}" class="btn btn-primary">Register</a>
                    </div>
                `;

                container.appendChild(col);
            });
        }
    </script>

</body>
</html>
