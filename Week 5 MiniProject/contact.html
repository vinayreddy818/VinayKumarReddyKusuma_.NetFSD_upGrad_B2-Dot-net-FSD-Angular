<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - Upgrad Events</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="Style.css">

</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary px-3">
    <a class="navbar-brand" href="index.html">Upgrad Events</a>
    <div class="ms-auto">
      <a href="Home.html" class="text-white me-3 text-decoration-none">Home</a>
      <a href="AdminLogin.html" class="text-white me-3 text-decoration-none">Login</a>
      <a href="events.html" class="text-white me-3 text-decoration-none">Events</a>
      <a href="contact.html" class="text-white text-decoration-none">Contact Us</a>
    </div>
  </nav>

  <!-- Contact Form -->
  <div class="contact-box">
    <h3 style ="color:white">Contact Us</h3>
    <div class="mb-3">
      <input type="text" id="contactName" class="form-control" placeholder="Name" required />
    </div>
    <div class="mb-3">
      <input type="email" id="contactEmail" class="form-control" placeholder="Email" required />
    </div>
    <div class="mb-3">
      <textarea id="contactDesc" class="form-control" rows="4" placeholder="Description" required></textarea>
    </div>
    <button class="btn btn-primary w-100" onclick="submitQuery()">Submit Query</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="contact.js"></script>

</body>
</html>
